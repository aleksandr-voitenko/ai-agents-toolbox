name: Nightly install smoke

on:
  pull_request:
  push:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  macos-url-bootstrap-smoke:
    name: macOS URL bootstrap smoke
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Run macOS curl bootstrap line
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/aleksandr-voitenko/ai-agents-toolbox/main/macos.sh | bash -s -- --install-missing
          curl -fsSL https://raw.githubusercontent.com/aleksandr-voitenko/ai-agents-toolbox/main/macos.sh | bash -s -- --check-only | tee /tmp/setup-tools-url-check.log
          grep -q "Missing packages: 0" /tmp/setup-tools-url-check.log
          ! grep -q "Version checks failed:" /tmp/setup-tools-url-check.log

  linux-url-bootstrap-smoke:
    name: Linux URL bootstrap smoke (${{ matrix.downloader }})
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        downloader:
          - curl
          - wget
    steps:
      - name: Run Linux ${{ matrix.downloader }} bootstrap line in Docker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -e GITHUB_TOKEN ubuntu:24.04 bash -lc '
            set -euo pipefail
            apt-get update
            if [ "${{ matrix.downloader }}" = "curl" ]; then
              apt-get install -y ca-certificates curl
              curl -fsSL https://raw.githubusercontent.com/aleksandr-voitenko/ai-agents-toolbox/main/linux.sh | bash -s -- --install-missing
              curl -fsSL https://raw.githubusercontent.com/aleksandr-voitenko/ai-agents-toolbox/main/linux.sh | bash -s -- --check-only | tee /tmp/setup-tools-url-check.log
            else
              apt-get install -y ca-certificates wget
              wget -qO- https://raw.githubusercontent.com/aleksandr-voitenko/ai-agents-toolbox/main/linux.sh | bash -s -- --install-missing
              wget -qO- https://raw.githubusercontent.com/aleksandr-voitenko/ai-agents-toolbox/main/linux.sh | bash -s -- --check-only | tee /tmp/setup-tools-url-check.log
            fi
            grep -q "Missing packages: 0" /tmp/setup-tools-url-check.log
            ! grep -q "Version checks failed:" /tmp/setup-tools-url-check.log
          '

  windows-url-bootstrap-smoke:
    name: Windows URL bootstrap smoke
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - name: Run Windows PowerShell URL bootstrap
        shell: pwsh
        run: |
          choco feature disable --name=showDownloadProgress
          $scriptUrl = "https://raw.githubusercontent.com/aleksandr-voitenko/ai-agents-toolbox/main/windows.ps1"
          $scriptPath = Join-Path $env:TEMP "ai-agents-toolbox-windows.ps1"
          Invoke-WebRequest -UseBasicParsing $scriptUrl -OutFile $scriptPath
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $checkLog = Join-Path $env:TEMP "setup-tools-url-check.log"
          $scriptPathLiteral = $scriptPath.Replace("'", "''")
          $childCommand = @"
          & '$scriptPathLiteral' -InstallMissing -Manager choco
          & '$scriptPathLiteral' -CheckOnly
          "@
          $childOutput = & $powershell -NoProfile -ExecutionPolicy Bypass -Command $childCommand 2>&1
          $childExitCode = $LASTEXITCODE
          $childOutput | Tee-Object -FilePath $checkLog
          if ($childExitCode -ne 0) {
            exit $childExitCode
          }
          $checkLogText = Get-Content -Raw -Path $checkLog
          $checkSections = [regex]::Split($checkLogText, '(?m)^Checking developer tools for Windows\.\.\.')
          $finalCheck = $checkSections[-1]
          if ($checkSections.Count -gt 1) {
            $finalCheck = "Checking developer tools for Windows...$finalCheck"
          }
          if ($finalCheck -match '(?m)^\s*Version checks failed:') {
            throw "Expected Windows check-only to omit zero version-check failures."
          }
          $expectedMissing = @("ast-grep")
          $missing = [regex]::Matches($finalCheck, '(?m)^\[missing\]\s+(\S+)') | ForEach-Object { $_.Groups[1].Value }
          $unexpectedMissing = @($missing | Where-Object { $expectedMissing -notcontains $_ })
          if ($unexpectedMissing.Count -gt 0) {
            throw "Unexpected missing Windows tool(s) after Chocolatey install: $($unexpectedMissing -join ', ')"
          }

  linux-install-smoke:
    name: Linux install smoke (${{ matrix.manager }})
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        event_name:
          - ${{ github.event_name }}
        manager:
          - apt
          - dnf
          - pacman
          - zypper
        include:
          - manager: apt
            image: ubuntu:24.04
            prepare: apt-get update
          - manager: dnf
            image: fedora:latest
            prepare: dnf -y makecache
          - manager: pacman
            image: archlinux:latest
            prepare: pacman -Sy --noconfirm
          - manager: zypper
            image: opensuse/tumbleweed:latest
            # Avoid a full refresh: Tumbleweed appstream metadata is large and
            # flaky on hosted runners, while install still builds package cache.
            prepare: zypper modifyrepo --no-refresh --all
        exclude:
          # Tumbleweed package retrieval is too unstable for unattended
          # scheduled runs, but zypper still runs in PR/push install smoke.
          - event_name: schedule
            manager: zypper
    steps:
      - uses: actions/checkout@v4

      - name: Run install smoke in disposable container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e GITHUB_TOKEN \
            -v "$PWD:/workspace" \
            -w /workspace \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              retry() {
                attempt=1
                max_attempts=3
                until "$@"; do
                  if [ "$attempt" -ge "$max_attempts" ]; then
                    return 1
                  fi
                  echo "prepare command failed; retrying in 30 seconds: $*"
                  sleep 30
                  attempt=$((attempt + 1))
                done
              }
              retry ${{ matrix.prepare }}
              ./linux.sh --install-missing --manager "${{ matrix.manager }}"
              ./linux.sh --check-only | tee /tmp/setup-tools-check.log
              grep -q "Missing packages: 0" /tmp/setup-tools-check.log
              ! grep -q "Version checks failed:" /tmp/setup-tools-check.log
            '

  macos-install-smoke:
    name: macOS install smoke
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install missing tools with Homebrew
        shell: bash
        run: |
          set -euo pipefail
          ./macos.sh --install-missing
          ./macos.sh --check-only | tee /tmp/setup-tools-check.log
          grep -q "Missing packages: 0" /tmp/setup-tools-check.log
          ! grep -q "Version checks failed:" /tmp/setup-tools-check.log

  windows-install-smoke:
    name: Windows install smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install missing tools with Chocolatey
        shell: pwsh
        run: |
          choco feature disable --name=showDownloadProgress
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $checkLog = Join-Path $env:TEMP "setup-tools-check.log"
          $scriptPath = (Resolve-Path .\windows.ps1).Path
          $scriptPathLiteral = $scriptPath.Replace("'", "''")
          $childCommand = @"
          & '$scriptPathLiteral' -InstallMissing -Manager choco
          & '$scriptPathLiteral' -CheckOnly
          "@
          $childOutput = & $powershell -NoProfile -ExecutionPolicy Bypass -Command $childCommand 2>&1
          $childExitCode = $LASTEXITCODE
          $childOutput | Tee-Object -FilePath $checkLog
          if ($childExitCode -ne 0) {
            exit $childExitCode
          }
          $checkLogText = Get-Content -Raw -Path $checkLog
          $checkSections = [regex]::Split($checkLogText, '(?m)^Checking developer tools for Windows\.\.\.')
          $finalCheck = $checkSections[-1]
          if ($checkSections.Count -gt 1) {
            $finalCheck = "Checking developer tools for Windows...$finalCheck"
          }
          if ($finalCheck -match '(?m)^\s*Version checks failed:') {
            throw "Expected Windows check-only to omit zero version-check failures."
          }
          $expectedMissing = @("ast-grep")
          $missing = [regex]::Matches($finalCheck, '(?m)^\[missing\]\s+(\S+)') | ForEach-Object { $_.Groups[1].Value }
          $unexpectedMissing = @($missing | Where-Object { $expectedMissing -notcontains $_ })
          if ($unexpectedMissing.Count -gt 0) {
            throw "Unexpected missing Windows tool(s) after Chocolatey install: $($unexpectedMissing -join ', ')"
          }
